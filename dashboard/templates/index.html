<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Warehouse Vision AI — Live Dashboard</title>
  <meta name="description" content="AI-powered warehouse dock monitoring and live inventory." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .audit-result-card {
        padding: 24px;
        margin-top: 24px;
        border-radius: var(--radius);
        text-align: center;
        display: none;
    }
    .audit-result-card.pass {
        background: var(--green-dim);
        border: 1px solid var(--green);
    }
    .audit-result-card.warning {
        background: var(--red-dim);
        border: 1px solid var(--red);
        animation: pulse-red 2s infinite;
    }
    @keyframes pulse-red {
        0% { box-shadow: 0 0 0 0 rgba(255,107,107, 0.4); }
        70% { box-shadow: 0 0 0 15px rgba(255,107,107, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255,107,107, 0); }
    }
    
    .status-large { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .status-large.pass-text { color: var(--green); }
    .status-large.warning-text { color: var(--red); }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <nav class="topbar">
    <div class="topbar-brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
      </div>
      <span class="brand-text">Warehouse <span class="brand-accent">Live Analytics</span></span>
    </div>
    <div class="topbar-actions">
      <div class="status-chip running" id="globalStatus">
        <span class="status-dot"></span>
        <span class="status-text">Connected</span>
      </div>
    </div>
  </nav>

  <main class="main-container">
    
    <section class="step-section">
      <div class="step-header">
        <div>
          <h2 class="step-title">Live Inventory</h2>
          <p class="step-desc">Monitoring from edge vision nodes</p>
        </div>
      </div>
      
      <div class="card glass-card">
        <div class="results-grid" style="grid-template-columns: 1fr;">
            <div class="stat-card stat-blue">
                <p class="stat-number" id="liveInventoryCount">0</p>
                <p class="stat-label">Live Staged Boxes</p>
            </div>
        </div>
        
        <div class="results-grid">
            <div class="stat-card stat-purple">
                <p class="stat-number" id="truckExitEvents">0</p>
                <p class="stat-label">Truck Exit Events</p>
            </div>
            <div class="stat-card stat-purple" style="opacity: 0.8;">
                <p class="stat-number" id="stagingArrivalEvents">0</p>
                <p class="stat-label">Staging Arrival Events</p>
            </div>
        </div>

        <div class="download-bar" style="justify-content: center; padding: 24px;">
            <button class="btn btn-primary" id="btnAudit" style="font-size: 1rem; padding: 14px 28px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Initiate Static Stack Audit
            </button>
        </div>
      </div>
      
      <div class="audit-result-card" id="auditResult">
          <h3 class="status-large" id="auditStatusTitle">PASS</h3>
          <p class="step-desc" id="auditDesc" style="margin-bottom: 16px;">Inventory appears consistent.</p>
          
          <div class="results-grid" style="background: rgba(0,0,0,0.2); border-radius: var(--radius-sm);">
            <div class="stat-card">
              <p class="stat-number" id="auditLiveCount" style="color: var(--text);">0</p>
              <p class="stat-label">Live Count</p>
            </div>
            <div class="stat-card">
              <p class="stat-number" id="auditEstimateCount" style="color: var(--text);">0</p>
              <p class="stat-label">Audit Estimate</p>
            </div>
            <div class="stat-card">
              <p class="stat-number" id="auditDifference" style="color: var(--text);">0</p>
              <p class="stat-label">Difference</p>
            </div>
          </div>
      </div>
      
    </section>

  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/static/app.js"></script>
</body>
</html>
